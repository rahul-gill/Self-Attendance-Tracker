name: Pre Merge Checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  gradle:
    runs-on: ubuntu-latest
    strategy:
      # Let each API level finish, so a flaky emulator on one doesn't cancel the other
      fail-fast: false
      matrix:
        api-level: [ 26, 36 ]
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v5
      - name: AVD cache
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}
      - name: create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Run Gradle tasks
        run: ./gradlew build --continue
      - name: Unit tests
        run: bash ./gradlew test --stacktrace
      - name: Integration tests
        # A healthy run takes a few minutes; fail instead of hanging until the 6h job limit
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          force-avd-creation: false
          # Cold boot: on API 26 the first adb command after restoring the cached
          # snapshot gets killed (exit code 137) before any test runs
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb logcat -c
            adb logcat -v time > logcat.txt 2>&1 < /dev/null &
            ./gradlew connectedAndroidTest
      - name: Print device log
        if: failure()
        run: |
          echo "::group::Test runner / crash / ANR lines"
          grep -E "TestRunner|AndroidRuntime|ANR in|UiAutomator|GestureController" logcat.txt | tail -n 150 || true
          echo "::endgroup::"
          echo "::group::Last 300 lines"
          tail -n 300 logcat.txt || true
          echo "::endgroup::"
      - name: Stop Gradle
        run: ./gradlew --stop
